="recent-list">${progress.sessions.length?progress.sessions.slice(-8).reverse().map(s=>`<div class="recent-item"><span>${META[s.skill]?.icon||'⭐'} <b>${esc(META[s.skill]?.name||s.skill)}</b><br><small>${new Date(s.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</small></span><span><b>${s.firstTry}/${s.total}</b> first try<br><small>⭐ +${s.stars}</small></span></div>`).join(''):'<p class="note">No completed missions yet.</p>'}</div><div class="baseline"><strong>Starting diagnostic: 6/10</strong>Areas to revisit: subtraction, missing numbers, positional logic, and money problems. This is the parent-provided starting point, not a score generated by the app.</div><div class="source-note"><strong>Learning reference</strong><p>Inspired by Eye Level Math Olympiad 2026 Grade 1 Practice Pack: arithmetic and regrouping (Concepts 03–09); visual patterns, overlapping shapes, and combining shapes (Concepts 13–16). Positional logic and the peso store are supplemental original games, not copied from the pack.</p></div></div></section><section class="official-panel" style="margin-top:20px"><h2>📝 Worksheet progress</h2><p>${sheetsOfProgress().length} completed attempts · ${completedSheetCount()} of ${SHEETS.length} sheets tried. Sheets do not affect adaptive game levels.</p><div class="parent-worksheet-list">${SHEETS.map(s=>{const r=sheetCompleted(s.id),last=r[r.length-1],best=r.length?Math.max(...r.map(x=>Math.round(x.correct/x.total*100))):null;return `<div class="parent-worksheet-row"><span>${s.icon} <b>${esc(s.name)}</b><br><small>${r.length?r.length+' attempt'+(r.length>1?'s':''):'Not started'}</small></span><span>${r.length?`Best ${best}% · Last ${last.correct}/${last.total}`:'—'}</span></div>`;}).join('')}</div><div class="data-buttons" style="margin-top:15px"><button data-act="export-worksheets">↓ Export worksheets CSV</button><button data-act="worksheets">📝 Practice sheets</button></div></section><section class="dashboard-grid"><div class=" id":"stretch-2"},{"type":"number","p":"2 groups of 5 make how many?","a":10,"hint":"Count five twice.","why":"5 + 5 = 10.","visual":"","label":"","id":"stretch-3"},{"type":"number","p":"36 + 27 = ?","a":63,"hint":"Add the ones and tens separately.","why":"30 + 20 + 6 + 7 = 63.","visual":"","label":"","id":"stretch-4"},{"type":"number","p":"52 − 18 = ?","a":34,"hint":"Subtract 10 first, then 8.","why":"52 − 10 − 8 = 34.","visual":"","label":"","id":"stretch-5"},{"type":"number","p":"105 + 12 = ?","a":117,"hint":"Keep the hundreds digit and add twelve to five.","why":"105 + 12 = 117.","visual":"","label":"","id":"stretch-6"},{"type":"number","p":"3 groups of 6 make how many?","a":18,"hint":"Six plus six plus six.","why":"6 + 6 + 6 = 18.","visual":"","label":"","id":"stretch-7"},{"type":"number","p":"70 − 26 = ?","a":44,"hint":"Subtract twenty, then six.","why":"70 − 20 − 6 = 44.","visual":"","label":"","id":"stretch-8"}]},{"id":"mixed","name":"Math Mix-Up","icon":"🏆","group":"Checkpoints","tag":"Mixed review","time":"18–25 min","focus":"Mixed arithmetic and reasoning review","concepts":"01–05, 07–08, 12–16 + supplemental","pages":"5–12, 17–22","skill":"subtraction","about":"A mixed checkpoint with original questions, not an external exam examination.","tip":"Do this after other sheets. Encourage independent work; timing is optional.","qs":[{"type":"number","p":"19 + 6 = ?","a":25,"hint":"Make a ten first.","why":"19 + 1 + 5 = 25.","visual":"","label":"","id":"mixed-1"},{"type":"number","p":"15 − 9 = ?","a":6,"hint":"Try taking ten then adding one back.","why":"15 − 10 + 1 = 6.","visual":"","label":"","id":"mixed-2"},{"type":"number","p":"□ + 8 = 17. What is □?","a":9,"hint":"How much more does eight need?","why":"9 + 8 = 17.","visual":"","label":"","id":"mixed-3"},{"type":"number","p":"24 − 7 = ?","a":17,"hint":"Subtract four to reach twenty.","why":"24 − 4 − 3 = 17.","visual":"","label":"","id":"mixed-4"},{"type":"choice","p":"Who is 3rd from the left?","opts":["Fox","Bear","Dog","Cat"],"a":"Bear","hint":"Count from the left end, one animal at a time.","why":"Bear is third from the left.","visual":"🐱   🐶   🐻   🦊","label":"","id":"mixed-5"},{"type":"number","p":"You have ₱20. You buy something worth ₱13. Change?","a":7,"hint":"Count up from thirteen to twenty.","why":"20 − 13 = ₱7.","visual":"","label":"","id":"mixed-6"},{"type":"choice","p":"Which picture comes next?","opts":["🟡","🟢","🔵","🔴"],"a":"🟡","hint":"Watch how the colors alternate.","why":"Yellow and green repeat.","visual":"🟡 🟢 🟡 🟢 ?","label":"","id":"mixed-7"},{"type":"number","p":"Two triangles have how many sides altogether?","a":6,"hint":"Each triangle has three sides.","why":"3 + 3 = 6.","visual":"","label":"","id":"mixed-8"},{"type":"number","p":"31 − 8 = ?","a":23,"hint":"Break eight into one and seven.","why":"31 − 1 − 7 = 23.","visual":"","label":"","id":"mixed-9"},{"type":"number","p":"7 + 8 + 3 = ?","a":18,"hint":"Can you make ten from two numbers?","why":"7 + 3 + 8 = 18.","visual":"","label":"","id":"mixed-10"}]}];

 ['01','Adding to 10–19',5],['02','Adding three one-digit numbers',6],['03','Subtracting from 10–19',7],['04','Subtracting three numbers',8],

let sheetScreen='library',activeSheet=null,sheetAnswers={},sheetHints=new Set(),sheetSubmitted=false,printMode='blank',worksheetGroup='All';
function sheetsOfProgress(){return Array.isArray(progress.worksheets)?progress.worksheets:[];}
function getSheet(id){return SHEETS.find(s=>s.id===id);}
function sheetCompleted(id){return sheetsOfProgress().filter(s=>s.id===id);}
function libraryTabs(){return `<nav class="library-nav" aria-label="Main sections"><button class="tab ${screen==='home'?'active':''}" data-act="home">🎮 Games</button><button class="tab ${screen==='worksheets'?'active':''}" data-act="worksheets">📝 Worksheets</button><button class="tab ${screen==='official'?'active':''}" data-act="official">📚 Learning notes</button></nav>`;}
function worksheetsHome(){const groups=['All','Start here','Core skills','Reasoning','Checkpoints','Optional stretch'];const visible=worksheetGroup==='All'?SHEETS:SHEETS.filter(s=>s.group===worksheetGroup);return `<section class="works-hero"><div><div class="tiny-label">📝 WORKSHEETS · VERSION 2.1</div><h1>Welcome to Worksheet Island!</h1><p>Write or tap answers, ask for hints, earn stars, or print a sheet for pencil-and-paper time. Pick your next adventure!</p></div><div class="works-emoji" aria-hidden="true">📚✨</div></section><div class="section-row"><div><h2>Choose a practice sheet</h2><p>Original questions, aligned to the topics Explorer is learning.</p></div><span class="tag">${SHEETS.length} sheets · ${SHEETS.reduce((n,s)=>n+s.qs.length,0)} questions</span></div><div class="library-nav" aria-label="Worksheet categories">${groups.map(g=>`<button class="tab ${worksheetGroup===g?'active':''}" data-act="sheet-group" data-group="${esc(g)}">${esc(g)}</button>`).join('')}</div><section class="works-grid">${visible.map(s=>{const past=sheetCompleted(s.id),best=past.length?Math.max(...past.map(r=>r.correct/r.total)):null;return `<article class="sheet-card"><div class="sheet-icon">${s.icon}</div><span class="sheet-tag ${s.tag==='Focus skill'?'focus':''}">${s.tag}</span><h3>${esc(s.name)}</h3><p>${esc(s.focus)}</p><div class="sheet-details"><span class="sheet-tag">${s.qs.length} questions</span><span class="sheet-tag">${s.time}</span>${best===null?'':`<span class="sheet-tag">Best ${Math.round(best*100)}%</span>`}</div><button class="card-go" data-act="open-sheet" data-sheet="${s.id}">${past.length?'Practice again':'Start worksheet'} →</button></article>`;}).join('')}</section><div class="official-panel"><h2>📚 Learn about the activities</h2><p>Explore the design of this original learning prototype and its practice activities.</p><button class="primary" data-act="official">Read learning notes →</button></div>`;}
function openSheet(id){const s=getSheet(id);if(!s)return;activeSheet=id;sheetAnswers={};sheetHints=new Set();sheetSubmitted=false;screen='worksheets';sheetScreen='detail';render();window.scrollTo(0,0);}
function sheetAnswer(q){const v=sheetAnswers[q.id];if(v===undefined||v===null||String(v).trim()==='')return false;return q.type==='number'?Number(String(v).trim())===q.a:String(v)===String(q.a);}
function completedSheetCount(){return SHEETS.filter(s=>sheetCompleted(s.id).length).length;}
function sheetDetail(){const s=getSheet(activeSheet);if(!s)return worksheetsHome();const answered=s.qs.filter(q=>sheetAnswers[q.id]!==undefined&&String(sheetAnswers[q.id]).trim()!=='').length;const correct=s.qs.filter(sheetAnswer).length;const firstTry=sheetsOfProgress().some(r=>r.id===s.id);const reward=Math.max(0,Math.min(5,Math.round(5*correct/s.qs.length)));
 return `<div class="sheet-detail"><div class="breadcrumb"><button class="back" data-act="worksheet-list">← All worksheets</button><div class="game-title">📝 Worksheet Island</div></div><header class="sheet-heading"><div class="tiny-label">${s.group} · ${s.tag}</div><h1>${s.icon} ${esc(s.name)}</h1><p>${esc(s.about)}</p><div class="sheet-badges"><span class="sheet-tag">${s.qs.length} questions</span><span class="sheet-tag">${s.time}</span><span class="sheet-tag">${esc(s.concepts==='Supplemental'?'Supplemental practice':'Skill topics '+s.concepts)}</span></div></header><div class="worksheet-tip"><b>💡 Grown-up teaching tip:</b> ${esc(s.tip)}</div><div class="sheet-tools"><button data-act="print-sheet" data-key="blank">🖨️ Print blank worksheet</button><button data-act="print-sheet" data-key="answer">🔑 Print answer key</button><span class="sheet-progress">${answered}/${s.qs.length} answered</span></div>${sheetSubmitted?`<section class="score-banner" aria-live="polite"><b>${correct}/${s.qs.length} correct</b><p>${correct===s.qs.length?'Amazing effort! You completed every challenge.':correct>=s.qs.length*.7?'Wonderful exploring! Check the questions marked for another try.':'Every try helps you learn! Read the hints, use counters, and keep going.'}</p><button class="primary" data-act="sheet-retry">Try this sheet again ↻</button></section>`:''}<section class="question-grid">${s.qs.map((q,i)=>`<article class="question-card"><div class="q-heading"><span class="q-index">QUESTION ${i+1}</span>${sheetSubmitted?`<span class="sheet-tag">${sheetAnswer(q)?'✅ Got it':'🌱 Keep practicing'}</span>`:''}</div><div class="q-prompt">${esc(q.p)}</div>${q.visual?`<div class="q-visual" aria-label="Illustration: ${esc(q.visual)}">${esc(q.visual)}</div>`:''}<div class="sheet-answer">${q.type==='number'?`<label for="answer-${q.id}">Your answer</label><input inputmode="numeric" type="number" id="answer-${q.id}" data-sheet-input="${q.id}" value="${esc(sheetAnswers[q.id]??'')}" ${sheetSubmitted?'disabled':''} placeholder="?" aria-label="Question ${i+1} answer">`:`<label>Choose one answer</label><div class="sheet-choices" role="group" aria-label="Question ${i+1} choices">${q.opts.map(v=>`<button data-act="sheet-choice" data-question="${q.id}" data-value="${esc(v)}" class="${sheetAnswers[q.id]===v?'picked':''}" ${sheetSubmitted?'disabled':''} aria-pressed="${sheetAnswers[q.id]===v}">${esc(v)}</button>`).join('')}</div>`}</div>${sheetSubmitted?`<div class="q-feedback ${sheetAnswer(q)?'':'no'}"><strong>${sheetAnswer(q)?'Well done!':'Answer: '+esc(q.a)}</strong><br>${esc(q.why)}</div>`:`<button class="hint-trigger" data-act="sheet-hint" data-question="${q.id}" aria-expanded="${sheetHints.has(q.id)}">💡 ${sheetHints.has(q.id)?'Hide':'Need a'} hint</button>${sheetHints.has(q.id)?`<div class="q-hint">${esc(q.hint)}</div>`:''}`}</article>`).join('')}</section>${!sheetSubmitted?`<section class="sheet-footer"><p>Take your time. You can check the answers once all questions have a response.</p><button class="primary green" data-act="submit-sheet" ${answered<s.qs.length?'disabled':''}>✨ Check my worksheet (${answered}/${s.qs.length})</button></section>`:''}<section class="source-note"><b>About this worksheet:</b> These are original practice questions, not copied external exam test items. ${s.concepts==='Supplemental'?'This skill supplements common early-math challenges.':'Aligned to Eye Level Grade 1 practice pack concepts '+esc(s.concepts)+', pages '+esc(s.pages)+'.'}</section></div>${printableSheet(s)}`;}
function printableSheet(s){const withKeys=printMode==='answer';return `<section class="print-sheet"><div class="print-head"><div><h1>Math Adventure · ${esc(s.name)}</h1><p>${esc(s.focus)}</p><p>Student name: ________________________ &nbsp; Date: ______________</p></div><div style="font-size:24px">${s.icon} 📝</div></div><div class="print-items">${s.qs.map((q,i)=>`<section class="print-item"><p class="pq">${i+1}. ${esc(q.p)}</p>${q.visual?`<div class="pv">${esc(q.visual)}</div>`:''}${q.type==='choice'?`<div class="pchoices">${q.opts.map((v,j)=>`${'ABCD'[j]}. ${esc(v)}`).join(' &nbsp;&nbsp; ')}</div>`:'<div class="answer-line"></div>'}${withKeys?`<div class="pkey"><b>Answer: ${esc(q.a)}</b><br>${esc(q.why)}</div>`:''}</section>`).join('')}</div><div class="print-foot">${withKeys?'PARENT ANSWER KEY':'Practice slowly, explain your thinking, and enjoy!'} · Original Math-olympiad-style practice · Not an official Eye Level examination.</div></section>`;}
function officialLibrary(){return `<section class="works-hero"><div><div class="tiny-label">📚 ABOUT THE LEARNING DEMO</div><h1>Learning notes</h1><p>This independent portfolio demo uses original practice questions, hands-on games, and printable worksheets.</p></div><div class="works-emoji">📖</div></section><section class="official-panel"><h2>Designed for understanding</h2><p>The games introduce subtraction, missing numbers, visual patterns, place value, spatial reasoning, positional logic and Philippine peso word problems. Each five-question mission has feedback and optional hints.</p><p>Ten worksheets add 82 original questions with answer checking and printable sheets. Recent accuracy helps adjust the difficulty of game missions. Progress is stored only in your browser; the demonstration has no accounts or cloud service.</p><p><b>Note:</b> No official competition papers or third-party answer keys are distributed here. This is an independent learning prototype, not an endorsed competition product.</p><button class="primary" data-act="worksheets">📝 Explore worksheets →</button></section>`;}
function submitSheet(){const s=getSheet(activeSheet);if(!s||sheetSubmitted)return;if(s.qs.some(q=>sheetAnswers[q.id]===undefined||String(sheetAnswers[q.id]).trim()===''))return;const correct=s.qs.filter(sheetAnswer).length;const existing=sheetsOfProgress().some(r=>r.id===s.id);const stars=existing?0:Math.max(1,Math.min(5,Math.round(5*correct/s.qs.length)));const rec={id:s.id,date:new Date().toISOString(),correct,total:s.qs.length,hints:sheetHints.size,stars,wrong:s.qs.filter(q=>!sheetAnswer(q)).map(q=>q.id)};progress.worksheets ||= [];progress.worksheets.push(rec);progress.worksheets=progress.worksheets.slice(-300);progress.stars+=stars;sheetSubmitted=true;save();render();document.querySelector('.score-banner')?.scrollIntoView({behavior:'smooth',block:'center'});}
function printWorksheet(kind){if(!activeSheet)return;printMode=kind==='answer'?'answer':'blank';render();window.print();}
window.addEventListener('afterprint',()=>{if(printMode!=='blank'){printMode='blank';render();}});

function render(){document.getElementById('app').innerHTML=topbar()+(screen==='home'?home():screen==='game'?gamePage():screen==='finish'?finish():screen==='parent'?parent():screen==='worksheets'?(libraryTabs()+(sheetScreen==='detail'?sheetDetail():worksheetsHome())):screen==='official'?(libraryTabs()+officialLibrary()):home())+`<footer class="footer">An independent interactive math-learning demo · No personal learner data or official exam papers included</footer>`;}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;
 if(act==='worksheets'){screen='worksheets';sheetScreen='library';game=null;render();window.scrollTo(0,0);}
 else if(act==='worksheet-list'){screen='worksheets';sheetScreen='library';render();window.scrollTo(0,0);}
 else if(act==='open-sheet')openSheet(btn.dataset.sheet);
 else if(act==='sheet-group'){worksheetGroup=btn.dataset.group;render();}
 else if(act==='official'){screen='official';game=null;render();window.scrollTo(0,0);}
 else if(act==='sheet-choice'&&!sheetSubmitted){sheetAnswers[btn.dataset.question]=btn.dataset.value;render();}
 else if(act==='sheet-hint'&&!sheetSubmitted){let id=btn.dataset.question;sheetHints.has(id)?sheetHints.delete(id):sheetHints.add(id);render();}
 else if(act==='submit-sheet')submitSheet();
 else if(act==='sheet-retry')openSheet(activeSheet);
 else if(act==='print-sheet')printWorksheet(btn.dataset.key);
 else if(act==='export-worksheets'){const rows=[['Date','Worksheet','Correct','Total','Accuracy %','Hints','Stars','Missed question IDs'],...sheetsOfProgress().map(x=>[x.date,getSheet(x.id)?.name||x.id,x.correct,x.total,Math.round(100*x.correct/x.total),x.hints,x.stars,(x.wrong||[]).join(' ')] )];download('math-adventure-demo-worksheet-results.csv',rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv');}
 else if(act==='home'){screen='home';game=null;render();window.scrollTo(0,0);}
 else if(act==='parent'){screen='parent';game=null;render();window.scrollTo(0,0);}
 else if(act==='start')start(btn.dataset.skill);
 else if(act==='tap-star'&&game){const i=Number(btn.dataset.i);game.taken.has(i)?game.taken.delete(i):game.taken.add(i);game.errorMsg='';render();}
 else if(act==='choose'&&game){game.selected=Number(btn.dataset.value);game.errorMsg='';render();}
 else if(act==='choose-pattern'&&game){game.selected=cur().options[Number(btn.dataset.choice)];game.errorMsg='';render();}
 else if(act==='choose-shape'&&game){game.selected=btn.dataset.name;game.errorMsg='';render();}
 else if(act==='choose-animal'&&game){game.selected=btn.dataset.name;game.errorMsg='';render();}
 else if(act==='adjust'&&game){game.bridge=Math.max(0,Math.min(cur().limit,game.bridge+Number(btn.dataset.delta)));game.errorMsg='';render();}
 else if(act==='trade'&&game&&!game.traded){game.traded=true;game.removedOnes.clear();game.removedTens.clear();game.errorMsg='';render();}
 else if(act==='take-ten'&&game){const i=Number(btn.dataset.i);game.removedTens.has(i)?game.removedTens.delete(i):game.removedTens.add(i);game.errorMsg='';render();}
 else if(act==='take-one'&&game){const i=Number(btn.dataset.i);game.removedOnes.has(i)?game.removedOnes.delete(i):game.removedOnes.add(i);game.errorMsg='';render();}
 else if(act==='paint'&&game){const i=Number(btn.dataset.i);game.painted.has(i)?game.painted.delete(i):game.painted.add(i);game.errorMsg='';render();}
 else if(act==='clear-grid'&&game){game.painted.clear();game.errorMsg='';render();}
 else if(act==='add-coin'&&game){let v=Number(btn.dataset.value);if(game.coins.reduce((s,x)=>s+x,0)+v<=100){game.coins.push(v);game.errorMsg='';render();}}
 else if(act==='undo-coin'&&game){game.coins.pop();game.errorMsg='';render();}
 else if(act==='hint'&&game){game.hinted=true;render();}
 else if(act==='check')check();
 else if(act==='next')next();
 else if(act==='export')download('math-adventure-demo-progress.json',JSON.stringify(progress,null,2),'application/json');
 else if(act==='export-csv'){const rows=[['Date','Game','Level','First try','Hint used','Wrong attempts','Seconds'],...progress.attempts.map(x=>[x.date,x.skill,x.level??'',x.firstTry?'Yes':'No',x.hinted?'Yes':'No',x.wrongAttempts||0,x.seconds||''])];download('math-adventure-demo-progress.csv',rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv');}
 else if(act==='import')document.getElementById('import-file')?.click();
 else if(act==='reset'&&confirm('Delete all stars, progress and sessions saved in V2 on this device? Export a backup first if you might want to restore it.')){progress=DEFAULT();save();render();}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-sheet-input]')&&!sheetSubmitted){sheetAnswers[e.target.dataset.sheetInput]=e.target.value;const s=getSheet(activeSheet);const answered=s.qs.filter(q=>sheetAnswers[q.id]!==undefined&&String(sheetAnswers[q.id]).trim()!=='').length;const btn=document.querySelector('[data-act="submit-sheet"]');if(btn){btn.disabled=answered<s.qs.length;btn.textContent=`✨ Check my worksheet (${answered}/${s.qs.length})`;}const count=document.querySelector('.sheet-progress');if(count)count.textContent=`${answered}/${s.qs.length} answered`;}});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-level-skill]')){const skill=e.target.dataset.levelSkill,v=e.target.value;progress.settings.overrides ||= {};if(v==='auto')delete progress.settings.overrides[skill];else progress.settings.overrides[skill]=Number(v);save();render();return;}
 if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!cleanData(parsed)||![1,2].includes(parsed.version)||parsed.attempts.length>100000||parsed.sessions.length>100000)throw Error('Invalid backup');if(!confirm('Replace the saved progress on this device with this V1/V2 backup?'))return;progress=migrate(parsed);save();render();alert('Progress restored. Welcome back!');}catch(err){alert('Sorry, that file is not a valid V1 or V2 progress backup.');}};reader.readAsText(file);}
});
document.addEventListener('keydown',e=>{if(screen!=='game'||!game||game.status!=='asking')return;if(game.skill==='missing'&&['ArrowRight','ArrowUp','ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();game.bridge=Math.min(cur().limit,Math.max(0,game.bridge+(['ArrowRight','ArrowUp'].includes(e.key)?1:-1)));render();}});
render();
})();
